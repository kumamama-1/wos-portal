<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}製造工程管理システム{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="app-header">
  <span class="app-title">🏭 製造工程管理システム</span>
  <form action="{{ url_for('set_user') }}" method="post" class="user-select-form">
    <select name="user_name" onchange="this.form.submit()">
      {% for u in USERS %}
      <option value="{{ u }}" {% if u == current_user %}selected{% endif %}>{{ u }}</option>
      {% endfor %}
    </select>
  </form>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<nav class="bottom-nav">
  <a href="{{ url_for('dashboard') }}"><span class="nav-icon">🏠</span>ホーム</a>
  <a href="{{ url_for('project_list') }}"><span class="nav-icon">📋</span>案件一覧</a>
  <a href="{{ url_for('project_new') }}" class="nav-highlight"><span class="nav-icon">➕</span>新規登録</a>
  <a href="{{ url_for('notifications_page') }}"><span class="nav-icon">🔔</span>通知</a>
</nav>

</body>
</html>
